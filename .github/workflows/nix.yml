name: Nix Flake Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  flake-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a

      # The flake uses GHC 9.12.4. Hydra does not build this compiler set,
      # so cache.nixos.org does not have the Haskell dependencies.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: >-
            nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix',
            '**/*.cabal') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Only the default branch writes new caches. PR caches would
          # remove each other under the 10 GB limit of each repository.
          save: ${{ github.ref == 'refs/heads/main' }}
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - run: nix flake check -L
