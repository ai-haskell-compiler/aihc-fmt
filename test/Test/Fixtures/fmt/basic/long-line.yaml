extensions: []
formatters:
  aihc-fmt:
    output: |
      module Main where
      h a b = if a
        then someVeryLongFunctionName a b (anotherLongFunction b a)
        else yetAnotherFunction (a + b) (a * b) a
      k a = someVeryLongFunctionName
        a
        (anotherLongFunction a a)
        (yetAnotherFunction a a)
        (oneMoreFunction a)
    status: pass
